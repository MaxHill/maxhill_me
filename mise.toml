monorepo_root = true

[monorepo]
config_roots = [
  ".",
  "apps/auth",
  "apps/golf",
  "apps/rss",
  "apps/site",
  "apps/syncdb-server",
  "packages/components",
  "packages/css",
  "packages/oxlint-config",
  "packages/syncdb",
  "packages/web-component-utils",
]

[tools]
opam = "2.5.1"
1password = "latest"
# Pinned to LTS — Playwright's browser extraction hangs on Node 26.x.
node = "22"
bun = "latest"
sops = "latest"

[env]
# The VPS. App subdomains (sync.maxhill.me, auth.maxhill.me, …) all
# resolve here; every deploy targets the same box.
VPS_HOST = "164.132.64.112"

# Every app and package exposes the same four canonical tasks:
#   run, test, fuzz, deploy
# See https://matklad.github.io/2023/12/31/O(1)-build-file.html
# Root-level tasks here fan out or delegate to the per-project mise.toml files.

[tasks.bootstrap]
description = "Provision (or re-provision) the VPS from /vps/. Runs as root."
run = "pnpm exec tsx vps/bootstrap.ts"

[tasks.generate]
description = "Run plop code-gen (templates in ./plop)."
run = "pnpm exec plop"

[tasks.setup]
description = "One-time local dev setup after clone (Playwright browsers, etc)."
dir = "packages/web-component-utils"
run = "pnpm exec playwright install --only-shell chromium"

# --- test / fuzz — fan out the canonical verbs across every workspace project ---

[tasks.test]
description = "Run every workspace project's `test` task (fail-fast)."
run = """
for d in apps/*/ packages/*/; do
  echo "::: $d test :::"
  (cd "$d" && mise run test) || exit 1
done
"""

[tasks.fuzz]
description = "Run every workspace project's `fuzz` task (fail-fast)."
run = """
for d in apps/*/ packages/*/; do
  echo "::: $d fuzz :::"
  (cd "$d" && mise run fuzz) || exit 1
done
"""

# --- dev:all — run every workspace project's `run` task in parallel (mprocs) ---

[tasks."run"]
description = "Run every workspace project's `run` task in parallel (mprocs)."
run = """
mprocs --names 'syncdb,css,oxlint-config,web-component-utils,components,auth,golf,site,syncdb-server' \
  'mise --cd packages/syncdb run run' \
  'mise --cd packages/css run run' \
  'mise --cd packages/oxlint-config run run' \
  'mise --cd packages/web-component-utils run run' \
  'mise --cd packages/components run run' \
  'mise --cd apps/auth run run' \
  'mise --cd apps/golf run run' \
  'mise --cd apps/site run run' \
  'mise --cd apps/syncdb-server run run'
"""

# --- deploy:* — publish an app to the VPS ---
[tasks."deploy:sync"]
description = "Deploy sync (OCaml service)."
dir = "apps/syncdb-server"
run = "mise run deploy"

[tasks."deploy:auth"]
description = "Deploy auth (Bun-compiled service)."
dir = "apps/auth"
run = "mise run deploy"

[tasks."deploy:site"]
description = "Deploy site (Astro static)."
dir = "apps/site"
run = "mise run deploy"

[tasks."deploy:golf"]
description = "Deploy golf (PWA static)."
dir = "apps/golf"
run = "mise run deploy"

[tasks."deploy:alert-on-failure"]
description = "Deploy alert-on-failure Resend env to VPS (no service restart)."
run = "pnpm exec tsx vps/alert-on-failure/deploy.ts"

[tasks."deploy:litestream"]
description = "Deploy litestream config + env to VPS."
run = "pnpm exec tsx vps/litestream/deploy.ts"
