# sops configuration.
#
# Which files are encrypted, and which age public keys can decrypt them.
# Every recipient listed under `age:` can decrypt; sops wraps the file's
# data key once per recipient.
#
# To add or rotate a recipient, see
# docs/runbooks/edit-secrets.md.

creation_rules:
  - path_regex: \.enc\.env$
    input_type: dotenv
    age:
      - age1fzjqfezgzhjlsejldsujzgtaj9qx23kh46un6jmupwmuwdsczq4qgvp54j
      - age1qsxv8kur5ta38thpkr8z7pfv566pfkd2g29xqn0makdgrtcsu3tq5xekun

