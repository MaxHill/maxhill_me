# Canonical verbs (O(1) build interface).
# Workspace config package — consumed via `workspace:*`, never published externally.

[tasks.run]
description = "Nothing to run for the shared oxlint config."
run = 'echo "no-op" && exit 0'

[tasks.test]
description = "Self-check the custom oxlint plugins."
run = "node ./max-len.test.mjs && node ./assertions-per-function.test.mjs"

[tasks.fuzz]
description = "Unbounded checks (none defined)."
run = 'echo "no-op" && exit 0'

[tasks.deploy]
description = "No build step; the config package ships as source."
run = 'echo "no-op" && exit 0'
