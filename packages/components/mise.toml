# Canonical verbs (O(1) build interface).
# Workspace library — consumed via `workspace:*`, never published externally.

[tasks.run]
description = "Watch-build components + CEM."
run = "pnpm exec vite build --watch & pnpm exec cem analyze --watch"

[tasks.test]
description = "Run web-test-runner suites."
run = "pnpm exec web-test-runner"

[tasks.fuzz]
description = "Unbounded checks (none defined)."
run = 'echo "no-op" && exit 0'

[tasks.deploy]
description = "One-shot build — produces the artifact consumers use."
run = "pnpm exec vite build && pnpm exec tsc --emitDeclarationOnly && pnpm exec cem analyze"
