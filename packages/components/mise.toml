[env]
_.path = ["./node_modules/.bin"]

# Canonical verbs (O(1) build interface).
# Workspace library — consumed via `workspace:*`, never deployed.

[tasks.run]
description = "Watch-build components + CEM."
run = "vite build --watch & cem analyze --watch"

[tasks.test]
description = "Run web-test-runner suites."
run = "web-test-runner"

[tasks.fuzz]
description = "Unbounded checks (none defined)."
run = 'echo "no-op" && exit 0'

[tasks.deploy]
description = "Workspace library — nothing to deploy."
run = 'echo "no-op" && exit 0'

# Implementation helpers:

[tasks.build]
description = "One-shot build (vite + tsc decls + cem analyze)."
run = "vite build && tsc --emitDeclarationOnly && cem analyze"
