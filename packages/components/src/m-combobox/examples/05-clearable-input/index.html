<div class="form">
  <m-combobox 
    name="clearable-example" 
    label="Clearable combobox (default)" 
    value="orange"
  >
    <m-option value="apple">Apple</m-option>
    <m-option value="orange">Orange</m-option>
    <m-option value="pear">Pear</m-option>
  </m-combobox>
  
  <m-combobox 
    name="not-clearable" 
    label="Not clearable" 
    value="pear"
    clearable="false"
  >
    <m-option value="apple">Apple</m-option>
    <m-option value="orange">Orange</m-option>
    <m-option value="pear">Pear</m-option>
  </m-combobox>
</div>
