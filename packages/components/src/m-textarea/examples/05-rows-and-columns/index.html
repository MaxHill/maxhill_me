<form class="form">
  <m-textarea 
      label="Small (3 rows - default)" 
      name="small" 
      placeholder="Default size"
  ></m-textarea>

  <m-textarea 
      label="Medium (5 rows)" 
      name="medium" 
      rows="5"
      placeholder="5 rows"
  ></m-textarea>

  <m-textarea 
      label="Large (10 rows)" 
      name="large" 
      rows="10"
      placeholder="10 rows"
  ></m-textarea>

  <m-textarea 
      label="Custom columns (30 cols)" 
      name="cols" 
      cols="30"
      placeholder="30 character columns"
  ></m-textarea>
</form>
