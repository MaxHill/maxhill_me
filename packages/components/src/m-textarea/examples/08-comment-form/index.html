<form class="form" id="comment-form">
  <m-textarea 
      label="Your comment" 
      name="comment" 
      required
      minlength="10"
      maxlength="500"
      rows="5"
      placeholder="Share your thoughts... (10-500 characters)"
      clearable
  ></m-textarea>

  <button type="submit">Post Comment</button>
</form>
<pre id="comment-output"></pre>
