<div class="pattern-controls">
  <label>
    Pattern
    <select id="graph-pattern-choice">
      <option value="grid">Grid</option>
      <option value="dots">Dots</option>
      <option value="lines">Lines</option>
      <option value="diagonal">Diagonal</option>
    </select>
  </label>
  <label>
    Spacing token
    <select id="graph-size-choice">
      <option value="2">2</option>
      <option value="5">5</option>
      <option value="8">8</option>
      <option value="fluid-2">fluid-2</option>
    </select>
  </label>
</div>
<m-bg-pattern id="graph-live-demo" pattern="grid" data-size="2">
  <h3>Change the pattern and spacing</h3>
  <p>The content stays in place when settings change.</p>
</m-bg-pattern>
