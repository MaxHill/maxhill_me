# Canonical verbs (O(1) build interface).
# Workspace library — consumed via `workspace:*`, never deployed.
# One-shot build lives in package.json (`pnpm -r build`).

[tasks.run]
description = "Watch-build idb-distribute."
run = "pnpm exec vite build --watch"

[tasks.test]
description = "Run vitest (bounded)."
run = "pnpm exec vitest run"

[tasks.fuzz]
description = "Unbounded checks (none defined)."
run = 'echo "no-op" && exit 0'

[tasks.deploy]
description = "Workspace library — nothing to deploy."
run = 'echo "no-op" && exit 0'
