[env]
_.path = ["./node_modules/.bin"]

# Canonical verbs (O(1) build interface).
# This is a workspace library — consumed via `workspace:*`, never deployed.
#   run    — build in watch mode so downstream apps pick up changes
#   test   — bounded automated checks (none)
#   fuzz   — unbounded checks (none)
#   deploy — n/a (library)

[tasks.run]
description = "Watch-build the CSS package."
run = "vite build --watch"

[tasks.test]
description = "Bounded checks (none defined)."
run = 'echo "no-op" && exit 0'

[tasks.fuzz]
description = "Unbounded checks (none defined)."
run = 'echo "no-op" && exit 0'

[tasks.deploy]
description = "Workspace library — nothing to deploy."
run = 'echo "no-op" && exit 0'

# Implementation helpers:

[tasks.build]
description = "One-shot build."
run = "vite build"
