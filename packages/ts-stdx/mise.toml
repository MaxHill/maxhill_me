# Source library — JavaScript is generated beside the TypeScript entry point.

[tasks.run]
description = "Watch-build the IndexedDB utilities."
run = "pnpm exec tsc src/index.ts --target ES2022 --module ESNext --strict --skipLibCheck --watch"

[tasks.test]
description = "Lint and type-check the IndexedDB utilities."
run = "pnpm exec oxlint . && pnpm exec tsc src/index.ts --target ES2022 --module ESNext --strict --skipLibCheck --noEmit"

[tasks.fuzz]
description = "Unbounded checks (none defined)."
run = 'echo "no-op" && exit 0'

[tasks.deploy]
description = "Generate the JavaScript entry point consumed by workspace packages."
run = "pnpm exec tsc src/index.ts --target ES2022 --module ESNext --strict --skipLibCheck"
