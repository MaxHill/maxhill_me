[env]
_.file = "../../vps/sync/sync.dev.env"

OPENSSL_DIR = "/opt/homebrew/opt/openssl@3"
CPATH = "/opt/homebrew/opt/openssl@3/include"
LIBRARY_PATH = "/opt/homebrew/opt/openssl@3/lib"
PKG_CONFIG_PATH = "/opt/homebrew/opt/openssl@3/lib/pkgconfig"

# Canonical verbs (O(1) build interface):
#   run    — start the local built-from-source copy
#   test   — bounded automated checks (dune runtest)
#   fuzz   — unbounded checks (simulator search)
#   deploy — publish

[tasks.run]
description = "Run sync locally."
run = "opam exec --switch=. -- dune exec ./bin/main.exe"

[tasks.test]
description = "Run bounded dune tests."
run = "opam exec --switch=. -- dune runtest"

[tasks.fuzz]
description = "Unbounded simulator search."
run = "opam exec --switch=. -- dune build ./sim_bin/simulator_sut.exe && opam exec --switch=. -- dune exec ./sim_bin/simulator.exe -- search"

[tasks.deploy]
description = "Deploy sync (OCaml service) to VPS."
run = "bash ../../vps/sync/deploy.sh"

# Implementation helpers:

[tasks.build]
description = "Build the OCaml project."
run = "opam exec --switch=. -- dune build"

[tasks.sim]
description = "Simulator entrypoint (pass args after --)."
run = "opam exec --switch=. -- dune build ./sim_bin/simulator_sut.exe && opam exec --switch=. -- dune exec ./sim_bin/simulator.exe --"

[tasks.setup]
description = "Provision the local opam switch and install deps."
run = "(opam switch show --switch=. >/dev/null 2>&1 || opam switch create . ocaml-base-compiler.5.2.0 --yes) && opam pin add --switch=. hegel git+https://github.com/hegeldev/hegel-ocaml.git#main -y && HEGEL_SRC=\"$(pwd)/_opam/.opam-switch/sources/hegel\" && opam exec --switch=. -- dune build --root \"$HEGEL_SRC\" ppx_hegel_compat.opam ppx_hegel_test.opam && opam pin add --switch=. ppx_hegel_compat \"$HEGEL_SRC\" -y && opam pin add --switch=. ppx_hegel_test \"$HEGEL_SRC\" -y && opam install --switch=. . --deps-only -y && opam install --switch=. ocaml-lsp-server ocamlformat merlin -y"
