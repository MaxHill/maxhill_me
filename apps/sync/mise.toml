[env]
_.file = "../../vps/sync/sync.dev.env"

OPENSSL_DIR = "/opt/homebrew/opt/openssl@3"
CPATH = "/opt/homebrew/opt/openssl@3/include"
LIBRARY_PATH = "/opt/homebrew/opt/openssl@3/lib"
PKG_CONFIG_PATH = "/opt/homebrew/opt/openssl@3/lib/pkgconfig"

# Canonical verbs (O(1) build interface):
#   run    — start the local built-from-source copy
#   test   — bounded automated checks (dune runtest)
#   fuzz   — unbounded checks (simulator search)
#   deploy — publish
# First-time opam switch setup: see docs/runbooks/bootstrap-sync.md

[tasks.run]
description = "Run sync locally."
run = "opam exec --switch=. -- dune exec ./bin/main.exe"

[tasks.test]
description = "Run bounded dune tests."
run = "opam exec --switch=. -- dune runtest"

[tasks.fuzz]
description = "Unbounded simulator search."
run = "opam exec --switch=. -- dune build ./sim_bin/simulator_sut.exe && opam exec --switch=. -- dune exec ./sim_bin/simulator.exe -- search"

[tasks.deploy]
description = "Deploy sync (OCaml service) to VPS."
run = "bash ../../vps/sync/deploy.sh"
