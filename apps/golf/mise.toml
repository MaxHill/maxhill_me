# Canonical verbs (O(1) build interface):
#   run    — start the local built-from-source copy
#   test   — bounded automated checks (web-test-runner)
#   fuzz   — unbounded checks (none)
#   deploy — publish

[tasks.run]
description = "Run the Vite dev server."
run = "pnpm exec vite"

[tasks.test]
description = "Oxlint + web-test-runner suites."
run = "pnpm exec oxlint . && pnpm exec web-test-runner"

[tasks.fuzz]
description = "Unbounded checks (none defined)."
run = 'echo "no-op" && exit 0'

[tasks.deploy]
description = "Deploy golf (PWA static) to VPS."
run = "pnpm exec tsx ../../vps/golf/deploy.ts"
