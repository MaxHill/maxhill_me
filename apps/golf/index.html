<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fbf3e9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="golf">
    <title>maxhill.me</title>
    <link rel="icon" type="image/png" href="/favicon.png?v=4">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <script>
      (function () {
        try {
          const theme = localStorage.getItem("theme");
          if (theme) {
            document.documentElement.setAttribute("data-theme", theme);
          } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            document.documentElement.setAttribute("data-theme", "dark");
          } else {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (_) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div class="main-menu">
      <!-- Mobile menu button -->
      <button
        id="page-menu-trigger"
        class="mobile-menu-button"
        popovertarget="page-menu"
        aria-label="Open menu"
      >
        Menu
      </button>

      <!-- Desktop navigation -->
      <nav class="desktop-nav">
        <a href="/">maxhill.me</a>
        <a href="/bag">/bag</a>
        <a href="/lag-putting">/lag-putting</a>
      </nav>

      <!-- Desktop theme button -->
      <div class="desktop-theme">
        <span id="auth-status-desktop" class="auth-status"></span>
        <button
          id="desktop-theme-trigger"
          class="theme-menu-button"
          popovertarget="desktop-theme-menu"
          aria-label="Change theme"
        >
          <span id="theme-label">Theme: System</span>
        </button>
      </div>
    </div>

    <!-- Desktop theme popover menu -->
    <m-popover-menu id="desktop-theme-menu" popover="auto" anchor="desktop-theme-trigger">
      <div class="menu-section">
        <h3 class="menu-title">Theme</h3>
        <form class="theme-switcher" data-target="html" data-persist="true">
          <label class="radio-input">
            <input type="radio" name="theme" value="system" />
            System
          </label>
          <label class="radio-input">
            <input type="radio" name="theme" value="light" />
            Light
          </label>
          <label class="radio-input">
            <input type="radio" name="theme" value="dark" />
            Dark
          </label>
        </form>
      </div>
    </m-popover-menu>

    <!-- Mobile popover menu -->
    <m-popover-menu id="page-menu" popover="auto" anchor="page-menu-trigger">
      <div class="menu-section">
        <h3 class="menu-title">Navigation</h3>
        <nav class="menu-nav">
          <a href="/">maxhill.me</a>
          <a href="/bag">/bag</a>
          <a href="/lag-putting">/lag-putting</a>
        </nav>
      </div>

      <div class="menu-section">
        <h3 class="menu-title">Theme</h3>
        <form class="theme-switcher" data-target="html" data-persist="true">
          <label class="radio-input">
            <input type="radio" name="theme" value="system" />
            System
          </label>
          <label class="radio-input">
            <input type="radio" name="theme" value="light" />
            Light
          </label>
          <label class="radio-input">
            <input type="radio" name="theme" value="dark" />
            Dark
          </label>
        </form>
      </div>
      <div class="menu-section">
        <h3 class="menu-title">Account</h3>
        <div id="auth-status-mobile" class="auth-status"></div>
      </div>
    </m-popover-menu>

    <main id="app">
      <!-- Router will inject page components here -->
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
