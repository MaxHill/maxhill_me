[env]
_.file = "../../vps/auth/auth.dev.env"

# Canonical verbs (O(1) build interface):
#   run    — start the local built-from-source copy
#   test   — bounded automated checks
#   fuzz   — unbounded checks (n/a here)
#   deploy — publish

[tasks.run]
description = "Run auth locally with hot reload."
run = "bun --watch src/index.ts run"

[tasks.test]
description = "Type-check (no other bounded checks defined)."
run = "pnpm exec tsc --noEmit"

[tasks.fuzz]
description = "Unbounded checks (none defined)."
run = 'echo "no-op" && exit 0'

[tasks.deploy]
description = "Deploy auth (Bun-compiled service) to VPS."
run = "bash ../../vps/auth/deploy.sh"

# Implementation helpers (not part of the canonical interface):

[tasks.build]
description = "Compile the linux-x64 binary."
run = "bun build --compile --target=bun-linux-x64 ./src/index.ts --outfile=./dist/auth-exe"
